<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FUEL FIGHTER">
    <title>⚔️ FUEL FIGHTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           🎨  ГЛОБАЛЬНЫЙ СТИЛЬ — SOLO LEVELING
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #05070d;
            --panel: rgba(13, 19, 31, .92);
            --panel-flat: rgba(0, 10, 26, .35);
            --border: rgba(0, 210, 255, .12);
            --border-soft: rgba(255, 255, 255, .04);
            --cyan: #00e5ff;
            --gold: #ffcb3d;
            --purple: #b475ff;
            --pink: #ff5c8f;
            --green: #3ee888;
            --text: #dbe9fb;
            --text-dim: #7291b3;
            --text-faint: #3d5474;
            --f-display: 'Rajdhani', sans-serif;
            --f-mono: 'JetBrains Mono', monospace;
            --radius: 20px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 10px;
            background-image: radial-gradient(circle at 20% 20%, rgba(0, 100, 200, .06), transparent 40%), radial-gradient(circle at 80% 80%, rgba(150, 50, 200, .04), transparent 40%);
        }
        .app {
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ============================================================
           🪟  ОСНОВНАЯ КАРТА
           ============================================================ */
        .glass {
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 18px 14px 14px;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(0, 180, 255, .04);
        }

        /* ============================================================
           🏷️  ШАПКА
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 {
            font-family: var(--f-display);
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header h1 small {
            display: block;
            font-family: var(--f-mono);
            font-size: 9px;
            color: var(--text-dim);
            -webkit-text-fill-color: var(--text-dim);
            letter-spacing: 2px;
            font-weight: 400;
        }
        .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .badge {
            font-family: var(--f-mono);
            background: rgba(0, 180, 255, .05);
            border: 1px solid rgba(0, 180, 255, .06);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .badge.gold {
            color: var(--gold);
            border-color: rgba(255, 203, 61, .12);
        }
        .badge.cyan {
            color: var(--cyan);
            border-color: rgba(0, 229, 255, .1);
        }

        /* ============================================================
           📊  БЫСТРЫЕ ИНДИКАТОРЫ (ДАШБОРД)
           ============================================================ */
        .quick-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }
        .quick-stat {
            background: var(--panel-flat);
            border-radius: 12px;
            padding: 8px 6px;
            text-align: center;
            border: 1px solid var(--border-soft);
        }
        .quick-stat .icon {
            font-size: 14px;
        }
        .quick-stat .value {
            font-family: var(--f-mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-top: 1px;
        }
        .quick-stat .value.cyan {
            color: var(--cyan);
        }
        .quick-stat .value.gold {
            color: var(--gold);
        }
        .quick-stat .value.green {
            color: var(--green);
        }
        .quick-stat .bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
            margin-top: 4px;
            overflow: hidden;
        }
        .quick-stat .bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width .8s ease;
        }
        .quick-stat .bar .fill.cyan {
            background: var(--cyan);
        }
        .quick-stat .bar .fill.gold {
            background: var(--gold);
        }
        .quick-stat .bar .fill.green {
            background: var(--green);
        }

        /* ============================================================
           📋  ПРОГРЕСС БАР
           ============================================================ */
        .progress-main {
            margin-bottom: 12px;
        }
        .progress-main .track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-main .track .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            border-radius: 10px;
            transition: width .8s ease;
        }
        .progress-main .info {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--text-faint);
            margin-top: 3px;
            font-family: var(--f-mono);
        }

        /* ============================================================
           📋  СПИСОК КВЕСТОВ (НА ГЛАВНОМ ЭКРАНЕ)
           ============================================================ */
        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        .quest-item {
            background: var(--panel-flat);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            transition: .2s;
            user-select: none;
            touch-action: manipulation;
        }
        .quest-item:active {
            transform: scale(.97);
        }
        .quest-item.done {
            opacity: .45;
        }
        .quest-item.done .q-title {
            text-decoration: line-through;
            color: var(--text-faint);
        }
        .quest-item .check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .06);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            transition: .25s;
            color: transparent;
        }
        .quest-item.done .check {
            border-color: var(--cyan);
            background: rgba(0, 229, 255, .06);
            color: var(--cyan);
        }
        .quest-item .q-info {
            flex: 1;
            min-width: 0;
        }
        .quest-item .q-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            font-family: var(--f-mono);
        }
        .quest-item .q-desc {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 1px;
        }
        .quest-item .q-xp {
            font-size: 9px;
            color: var(--gold);
            font-weight: 700;
            font-family: var(--f-mono);
            background: rgba(255, 203, 61, .04);
            padding: 1px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 203, 61, .04);
            flex-shrink: 0;
        }

        /* ============================================================
           💡  СОВЕТ
           ============================================================ */
        .tip {
            font-size: 9px;
            color: var(--text-dim);
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid var(--border-soft);
            font-family: var(--f-mono);
            margin-bottom: 10px;
        }

        /* ============================================================
           📱  НИЖНЯЯ НАВИГАЦИЯ (ТАБЫ)
           ============================================================ */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 6px 4px;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(0, 180, 255, .04);
            flex-shrink: 0;
        }
        .nav-btn {
            border: none;
            background: transparent;
            color: var(--text-dim);
            padding: 6px 0;
            border-radius: 14px;
            cursor: pointer;
            transition: .25s;
            font-family: var(--f-display);
            font-size: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .3px;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .nav-btn .icon {
            font-size: 18px;
            line-height: 1;
        }
        .nav-btn.active {
            background: rgba(0, 180, 255, .06);
            color: var(--cyan);
            box-shadow: inset 0 0 0 1px rgba(0, 229, 255, .06);
        }
        .nav-btn:active {
            transform: scale(.94);
        }

        /* ============================================================
           📱  КОНТЕНТ ВКЛАДОК
           ============================================================ */
        .tab-content {
            display: none;
            animation: fade .3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .tab-content .section-title {
            font-family: var(--f-display);
            font-size: 13px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        /* ============================================================
           🍎  ЕДА — ПРОДУКТЫ
           ============================================================ */
        .food-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 10px;
        }
        .food-product {
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 6px 8px;
            border: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: .2s;
        }
        .food-product:active {
            transform: scale(.96);
        }
        .food-product .icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .food-product .info {
            flex: 1;
            min-width: 0;
        }
        .food-product .name {
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
            font-family: var(--f-mono);
        }
        .food-product .macro {
            font-size: 8px;
            color: var(--text-dim);
        }

        .food-diary {
            max-height: 100px;
            overflow-y: auto;
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--f-mono);
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-soft);
            margin-bottom: 8px;
        }
        .food-diary .entry {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .02);
        }
        .food-diary .entry:last-child {
            border-bottom: none;
        }
        .food-diary .empty {
            color: var(--text-faint);
        }

        .water-track {
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-soft);
            margin-bottom: 8px;
        }
        .water-track .top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--f-mono);
        }
        .water-track .bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
            overflow: hidden;
            margin: 4px 0;
        }
        .water-track .bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b4ff, var(--cyan));
            border-radius: 10px;
            transition: width .8s ease;
        }
        .water-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .water-btns button {
            background: rgba(0, 180, 255, .04);
            border: 1px solid rgba(0, 180, 255, .04);
            padding: 2px 10px;
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 9px;
            cursor: pointer;
            transition: .2s;
            font-family: var(--f-mono);
        }
        .water-btns button:active {
            transform: scale(.94);
        }

        /* ============================================================
           🥊  ТРЕНИРОВКИ
           ============================================================ */
        .train-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 10px;
        }
        .train-card {
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-soft);
        }
        .train-card .label {
            font-size: 7px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .train-card .value {
            font-size: 16px;
            font-weight: 700;
            font-family: var(--f-mono);
            margin-top: 1px;
        }
        .train-card .value.cyan {
            color: var(--cyan);
        }
        .train-card .value.gold {
            color: var(--gold);
        }
        .train-card .value.pink {
            color: var(--pink);
        }
        .train-card .value.purple {
            color: var(--purple);
        }
        .train-card .bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
            margin-top: 4px;
            overflow: hidden;
        }
        .train-card .bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width .8s ease;
        }
        .fill.cyan {
            background: var(--cyan);
        }
        .fill.gold {
            background: var(--gold);
        }
        .fill.pink {
            background: var(--pink);
        }
        .fill.purple {
            background: var(--purple);
        }

        .train-log {
            max-height: 80px;
            overflow-y: auto;
            font-size: 9px;
            color: var(--text-dim);
            font-family: var(--f-mono);
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-soft);
        }
        .train-log .entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .02);
        }
        .train-log .entry:last-child {
            border-bottom: none;
        }
        .train-log .entry .time {
            color: var(--text-faint);
            margin-right: 4px;
        }

        /* ============================================================
           ❤️  БЛИЗКИЕ
           ============================================================ */
        .heart-card {
            background: var(--panel-flat);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border-soft);
            margin-bottom: 10px;
            text-align: center;
        }
        .heart-card .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--pink);
            font-family: var(--f-display);
        }
        .heart-card .detail {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 3px;
        }
        .heart-card .detail span {
            color: var(--text);
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 8px;
        }
        .idea-item {
            background: var(--panel-flat);
            border-radius: 8px;
            padding: 6px 8px;
            border: 1px solid var(--border-soft);
            font-size: 9px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: .2s;
            font-family: var(--f-mono);
        }
        .idea-item:active {
            transform: scale(.95);
        }
        .idea-item.done {
            opacity: .3;
            text-decoration: line-through;
        }

        /* ============================================================
           🏆  АНАЛИТИКА
           ============================================================ */
        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 10px;
        }
        .analytics-card {
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-soft);
        }
        .analytics-card .label {
            font-size: 7px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .analytics-card .value {
            font-size: 14px;
            font-weight: 700;
            font-family: var(--f-mono);
            margin-top: 1px;
        }
        .analytics-card .value.cyan {
            color: var(--cyan);
        }
        .analytics-card .value.gold {
            color: var(--gold);
        }
        .analytics-card .value.purple {
            color: var(--purple);
        }
        .analytics-card .value.pink {
            color: var(--pink);
        }
        .analytics-card .mini-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
            margin-top: 4px;
            overflow: hidden;
        }
        .analytics-card .mini-bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width .8s ease;
        }

        .radar-wrap {
            background: var(--panel-flat);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border-soft);
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* ============================================================
           ⚙️  НАСТРОЙКИ
           ============================================================ */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-flat);
            border-radius: 10px;
            padding: 8px 12px;
            border: 1px solid var(--border-soft);
            margin-bottom: 4px;
        }
        .settings-row .label {
            font-size: 10px;
            color: var(--text);
            font-weight: 500;
        }
        .settings-row .hint {
            font-size: 8px;
            color: var(--text-dim);
            margin-top: 1px;
        }
        .switch {
            width: 34px;
            height: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .06);
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            transition: .2s;
            border: 1px solid var(--border-soft);
        }
        .switch.on {
            background: rgba(0, 229, 255, .2);
            border-color: rgba(0, 229, 255, .2);
        }
        .switch i {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6b8db5;
            transition: .25s;
        }
        .switch.on i {
            left: 16px;
            background: var(--cyan);
            box-shadow: 0 0 8px rgba(0, 229, 255, .4);
        }

        .btn {
            background: rgba(0, 180, 255, .04);
            border: 1px solid rgba(0, 180, 255, .04);
            padding: 4px 12px;
            border-radius: 30px;
            color: var(--text-dim);
            font-size: 9px;
            cursor: pointer;
            transition: .2s;
            font-family: var(--f-mono);
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(.95);
        }
        .btn.gold {
            border-color: rgba(255, 203, 61, .08);
            color: var(--gold);
        }
        .btn.pink {
            border-color: rgba(255, 92, 143, .08);
            color: var(--pink);
        }
        .btn.wide {
            width: 100%;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .danger-zone {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-soft);
        }

        /* ============================================================
           🔔  ТОСТ
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(.95);
            background: rgba(3, 6, 14, .96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 180, 255, .1);
            border-radius: 14px;
            padding: 10px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .8);
            z-index: 300;
            max-width: 90%;
            text-align: center;
            font-family: var(--f-mono);
            font-size: 11px;
            color: var(--text);
            transition: all .5s cubic-bezier(.34, 1.56, .64, 1);
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }
        .toast .t-title {
            color: var(--cyan);
            font-weight: 700;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .toast .t-body {
            margin-top: 2px;
            color: var(--text-dim);
            font-size: 10px;
        }
        .toast .t-xp {
            color: var(--gold);
            font-weight: 700;
        }

        /* ============================================================
           📱  АДАПТИВ
           ============================================================ */
        @media (max-width: 380px) {
            .quick-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 4px;
            }

                    { id: 'streak30', icon: '🌑', name: 'Тень Монарха', desc: 'Стрик 30 дней', target: 30,
                        get: s => s.streak, reward: { all: 15 } },
                    { id: 'level10', icon: '✨', name: 'Пробуждение', desc: 'LV. 10', target: 10, get: s => s.level,
                        reward: { stat: 'mana', val: 10 } },
                    { id: 'topics5', icon: '📚', name: 'Архимаг Кода', desc: '5 тем ИБ', target: 5, get: s => s.code
                            .topics.length, reward: { stat: 'int', val: 8 } },
                    { id: 'heart10', icon: '💞', name: 'Хранитель сердца', desc: '10 идей', target: 10, get: s => s
                            .heart.ideasDone.length, reward: { stat: 'cha', val: 10 } },
                    { id: 'days30', icon: '🏛️', name: 'Столп дисциплины', desc: '30 дней выполнено', target: 30,
                        get: s => s.daysCompleted, reward: { stat: 'end', val: 12 } }
                ],
                FAKE_HUNTERS: ['Jester', 'Vex', 'Raven', 'Shadow', 'Lynx', 'Ghost', 'Wraith', 'Phantom']
            };

            // ════════════════════════════════════════════════
            //   📦  СОСТОЯНИЕ
            // ════════════════════════════════════════════════

            const state = {
                level: 1,
                xp: 0,
                totalXP: 0,
                rankIdx: 0,
                stats: { will: 10, atk: 10, def: 5, agi: 15, int: 12, end: 10, cha: 8, mana: 5 },
                quests: CONFIG.QUESTS.map(() => false),
                customQuests: [],
                streak: 0,
                lastActiveDate: '',
                streakAwardedDate: '',
                water: 0,
                waterLast: null,
                food: { cal: 0, protein: 0, log: [] },
                artifacts: [],
                unlockedAchievements: [],
                totalDays: 0,
                daysCompleted: 0,
                training: { power: 0, flex: 0, tech: 0, endurance: 0, log: [] },
                code: { hours: 0, topics: [], streak: 0, lastStudyDate: '', log: [] },
                heart: { time: 0, ideasDone: [] },
                sleep: { hours: 0, bedtime: null, wakeup: null, quality: 0 },
                progress: { weight: 75, waist: 85, hips: 95 },
                history: {},
                settings: { sound: true },
                companion: { flowers: 'Белые розы', food: 'Ищет себя', tiktok: 'Любит смотреть' }
            };
            let fakeHunters = [];

            // ════════════════════════════════════════════════
            //   💾  СОХРАНЕНИЕ
            // ════════════════════════════════════════════════

            function saveData() {
                try {
                    const payload = {
                        level: state.level,
                        xp: state.xp,
                        totalXP: state.totalXP,
                        rankIdx: state.rankIdx,
                        stats: state.stats,
                        quests: state.quests,
                        customQuests: state.customQuests,
                        streak: state.streak,
                        lastActiveDate: state.lastActiveDate,
                        streakAwardedDate: state.streakAwardedDate,
                        water: state.water,
                        waterLast: state.waterLast,
                        food: state.food,
                        artifacts: state.artifacts,
                        unlockedAchievements: state.unlockedAchievements,
                        totalDays: state.totalDays,
                        daysCompleted: state.daysCompleted,
                        training: state.training,
                        code: state.code,
                        heart: state.heart,
                        sleep: state.sleep,
                        progress: state.progress,
                        history: state.history,
                        settings: state.settings,
                        companion: state.companion,
                        fakeHunters: fakeHunters
                    };
                    localStorage.setItem('fighterData', JSON.stringify(payload));
                } catch (_) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem('fighterData');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    Object.keys(data).forEach(k => {
                        if (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && state[k] && typeof
                            state[k] === 'object') {
                            Object.assign(state[k], data[k]);
                        } else {
                            state[k] = data[k];
                        }
                    });
                    if (data.fakeHunters) fakeHunters = data.fakeHunters;
                    return true;
                } catch (_) { return false; }
            }

            let saveTimer = null;

            function queueSave() {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveData, 300);
            }

            // ════════════════════════════════════════════════
            //   🎮  ЯДРО СИСТЕМЫ
            // ════════════════════════════════════════════════

            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
            }

            function tone(freq, dur, type = 'sine', vol = .04) {
                if (!state.settings.sound) return;
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator(),
                        gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch (_) {}
            }
            const sound = {
                xp: () => { tone(800, .05);
                    setTimeout(() => tone(1000, .04), 60); },
                levelUp: () => { tone(600, .06, 'square', .03);
                    setTimeout(() => tone(800, .06, 'square', .03), 80);
                    setTimeout(() => tone(1000, .1, 'square', .05), 160); },
                rankUp: () => { tone(400, .1, 'sawtooth', .02);
                    setTimeout(() => tone(600, .1, 'sawtooth', .03), 110);
                    setTimeout(() => tone(800, .15, 'sawtooth', .05), 220);
                    setTimeout(() => tone(1000, .2, 'sine', .06), 350); },
                water: () => { tone(1200, .03);
                    setTimeout(() => tone(1400, .03), 40); },
                heart: () => { tone(500, .08, 'sine', .04);
                    setTimeout(() => tone(600, .08, 'sine', .03), 100);
                    setTimeout(() => tone(700, .12, 'sine', .02), 200); },
                error: () => tone(200, .2, 'sawtooth', .02)
            };

            let toastTimer = null;

            function showToast(title, body, xp = null) {
                const el = document.getElementById('toast');
                document.getElementById('toastTitle').textContent = title;
                document.getElementById('toastBody').innerHTML = body + (xp ? ' <span class="t-xp">+' + xp + ' XP</span>' :
                '');
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
            }

            function xpForLevel() { return CONFIG.BASE_XP + (state.level - 1) * 20; }

            function addXP(amount, label) {
                state.xp += amount;
                state.totalXP += amount;
                sound.xp();
                showToast(label ? '⚡ ' + label : '⚡ Опыт', label || 'Опыт получен.', amount);
                checkLevelUp();
                checkRankUp();
                checkAchievements();
                queueSave();
                renderAll();
            }

            function checkLevelUp() {
                let needed = xpForLevel();
                while (state.xp >= needed) {
                    state.xp -= needed;
                    state.level++;
                    sound.levelUp();
                    showToast('⬆ УРОВЕНЬ ПОВЫШЕН!', 'Ты достиг LV. ' + state.level);
                    for (const k in state.stats) state.stats[k] = Math.floor(state.stats[k] * 1.05) + 1;
                    needed = xpForLevel();
                }
            }

            function checkRankUp() {
                const next = CONFIG.RANKS[state.rankIdx + 1];
                if (next && state.totalXP >= next.totalXP) {
                    state.rankIdx++;
                    sound.rankUp();
                    showToast('🏆 РАНГ ПОВЫШЕН!', 'Новый ранг: ' + next.label);
                    grantArtifact('⚔️ Клинок ' + next.label, '+5 ко всем статам');
                    for (const k in state.stats) state.stats[k] += 5;
                }
            }

            function grantArtifact(name, effect) {
                state.artifacts.push({ name, effect });
                showToast('🎁 АРТЕФАКТ ПОЛУЧЕН!', name + ': ' + effect);
            }

            function checkAchievements() {
                CONFIG.ACHIEVEMENTS.forEach(a => {
                    if (state.unlockedAchievements.includes(a.id)) return;
                    if (a.get(state) >= a.target) {
                        state.unlockedAchievements.push(a.id);
                        if (a.reward.all) { for (const k in state.stats) state.stats[k] += a.reward.all; } else if (a
                            .reward.stat) { state.stats[a.reward.stat] = (state.stats[a.reward.stat] || 0) + a
                                .reward.val; }
                        grantArtifact(a.icon + ' ' + a.name, 'Достижение разблокировано');
                    }
                });
            }

            function todayStr() { return new Date().toISOString().split('T')[0]; }

            function yesterdayStr() { const d = new Date();
                d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0]; }

            function rolloverIfNeeded() {
                const today = todayStr();
                if (state.lastActiveDate === today) return;
                if (state.lastActiveDate && state.lastActiveDate !== yesterdayStr()) {
                    state.streak = 0;
                }
                state.quests = CONFIG.QUESTS.map(() => false);
                state.water = 0;
                state.food = { cal: 0, protein: 0, log: [] };
                state.lastActiveDate = today;
            }

            function recordHistory() {
                const total = CONFIG.QUESTS.length;
                const done = state.quests.filter(Boolean).length;
                state.history[todayStr()] = total ? done / total : 0;
                const keys = Object.keys(state.history).sort();
                while (keys.length > 90) { delete state.history[keys.shift()]; }
            }

            // ════════════════════════════════════════════════
            //   📋  КВЕСТЫ
            // ════════════════════════════════════════════════

            function completeQuest(index) {
                if (state.quests[index]) return;
                state.quests[index] = true;
                const q = CONFIG.QUESTS[index];
                if (q.stat) state.stats[q.stat] = (state.stats[q.stat] || 0) + q.val;
                recordHistory();
                addXP(q.xp, 'Квест "' + q.label + '"');
                const allDone = state.quests.every(Boolean);
                if (allDone) {
                    showToast('🎉 ВСЕ КВЕСТЫ ВЫПОЛНЕНЫ!', '+30 бонусных XP');
                    state.daysCompleted++;
                    state.totalDays++;
                    if (state.streakAwardedDate !== todayStr()) {
                        state.streak++;
                        state.streakAwardedDate = todayStr();
                    }
                    updateFakeHunters();
                    addXP(30, 'Бонус за день');
                }
            }

            function addCustomQuest() {
                const label = prompt('Название разового квеста:');
                if (!label) return;
                let xp = parseInt(prompt('Сколько XP он стоит?', '10'), 10);
                if (!Number.isFinite(xp) || xp <= 0) xp = 10;

            // ════════════════════════════════════════════════

            function buildRadar() {
                const keys = ['agi', 'int', 'atk', 'end', 'cha', 'mana'];
                const n = keys.length;
                const size = 200,
                    cx = size / 2,
                    cy = size / 2,
                    R = 75;
                const max = Math.max(40, ...keys.map(k => state.stats[k] || 0)) * 1.15;
                const pt = (i, r) => {
                    const ang = -Math.PI / 2 + i * (2 * Math.PI / n);
                    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
                };
                let rings = '';
                [0.25, 0.5, 0.75, 1].forEach(f => {
                    const pts = keys.map((_, i) => pt(i, R * f).join(',')).join(' ');
                    rings += '<polygon points="' + pts +
                        '" fill="none" stroke="rgba(0,229,255,0.06)" stroke-width="1"/>';
                });
                let spokes = '',
                    labels = '';
                keys.forEach((k, i) => {
                    const [x, y] = pt(i, R);
                    spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y +
                        '" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';
                    const [lx, ly] = pt(i, R + 18);
                    labels +=
                        '<text x="' + lx + '" y="' + ly +
                        '" fill="#7291b3" font-size="8" font-family="JetBrains Mono, monospace" text-anchor="middle" dominant-baseline="middle">' +
                        CONFIG.STAT_META[k].icon + '</text>';
                });
                const dataPts = keys.map((k, i) => pt(i, R * Math.min(1, (state.stats[k] || 0) / max)).join(',')).join(' ');
                return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
                    rings + spokes +
                    '<polygon points="' + dataPts +
                    '" fill="rgba(0,229,255,0.12)" stroke="#00e5ff" stroke-width="1.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(0,229,255,.3));"/>' +
                    labels +
                    '</svg>';
            }

                    if (!e.target.files[0]) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.state) {
                                Object.keys(data.state).forEach(k => {
                                    if (data.state[k] && typeof data.state[k] === 'object' && state[
                                        k] && typeof state[k] === 'object') {
                                        Object.assign(state[k], data.state[k]);
                                    } else {
                                        state[k] = data.state[k];
                                    }
                                });
                            }
                            if (data.fakeHunters) fakeHunters = data.fakeHunters;
                            showToast('⬆️ Импортировано', 'Прогресс восстановлен');
                            queueSave();
                            renderAll();
                        } catch (_) {
                            showToast('⚠️ Ошибка', 'Файл повреждён');
                            sound.error();
                        }
                    };
                    reader.readAsText(e.target.files[0]);
                    e.target.value = '';
                });

                document.getElementById('resetBtn').addEventListener('click', function() {
                    if (confirm('🗡️ Перерождение сбросит весь прогресс. Продолжить?')) {
                        localStorage.removeItem('fighterData');
                        location.reload();
                    }
                });
            }

            function wireEvents() {
                // Навигация
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        const target = document.getElementById(this.dataset.tab);
                        if (target) target.classList.add('active');
                        // Прокручиваем вверх
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });

                // Квесты
                document.getElementById('questList').addEventListener('click', function(e) {
                    initAudio();
                    const rm = e.target.closest('[data-remove]');
                    if (rm) {
                        const idx = parseInt(rm.dataset.remove, 10);
                        state.customQuests.splice(idx, 1);
                        queueSave();
                        renderAll();
                        return;
                    }
                    const q = e.target.closest('[data-quest]');
                    if (q) { completeQuest(parseInt(q.dataset.quest, 10));
                        renderAll(); return; }
                    const c = e.target.closest('[data-custom]');
                    if (c) { completeCustomQuest(parseInt(c.dataset.custom, 10));
                        renderAll(); }
                });

                // Разовый квест
                document.getElementById('addQuestBtn') && document.getElementById('addQuestBtn').addEventListener('click',
                    addCustomQuest);

                // Вода
                document.querySelectorAll('[data-water]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const v = this.dataset.water;
                        addWater(v === 'reset' ? 'reset' : parseInt(v, 10));
                    });
                });

                // Тренировки
                document.getElementById('trainStrike').addEventListener('click', trainStrike);
                document.getElementById('trainStretch').addEventListener('click', trainStretch);
                document.getElementById('trainTech').addEventListener('click', trainTech);

                // Близкие
                document.getElementById('heartAddTime').addEventListener('click', addHeartTime);
                document.getElementById('heartIdea').addEventListener('click', randomIdea);

                // Активация звука
                document.addEventListener('touchstart', initAudio, { once: true });
                document.addEventListener('click', initAudio, { once: true });
            }

            // ════════════════════════════════════════════════
            //   🚀  ЗАПУСК
            // ════════════════════════════════════════════════

            function init() {
                const loaded = loadData();
                rolloverIfNeeded();
                if (!fakeHunters.length) fakeHunters = seedFakeHunters();
                if (!loaded) {
                    grantArtifact('🗡️ Кинжал Новичка', '+2 к Атаке');
                    state.stats.atk += 2;
                    saveData();
                }
                wireEvents();
                renderAll();
                showToast(loaded ? '🗡️ СИСТЕМА ЗАГРУЖЕНА' : '🗡️ ПРОБУЖДЕНИЕ',
                    loaded ? 'Продолжай свой путь' : 'Добро пожаловать');
                setTimeout(() => {
                    if (state.level === 1 && state.totalXP === 0) {
                        showToast('💡 СОВЕТ', 'Выполняй квесты — они дают опыт');
                    }
                }, 1500);
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
